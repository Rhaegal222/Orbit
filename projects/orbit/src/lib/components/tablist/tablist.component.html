@if (overflowing()) {
  <div class="orbit-tablist__compact">
    <div class="orbit-tablist__compact-current">
      <span class="orbit-tablist__compact-label">{{ currentTab?.label() ?? '' }}</span>
      @if (currentTab?.badge()) {
        <orbit-badge [label]="currentTab!.badge()!.label()" [tone]="currentTab!.badge()!.tone()" />
      }
    </div>
    <div class="orbit-tablist__compact-actions">
      <div class="orbit-tablist__mode-toggle" role="radiogroup" ariaLabel="Modalità di selezione">
        <orbit-icon-button
          icon="menu"
          ariaLabel="Menu laterale"
          [attr.aria-checked]="pickerMode() === 'offcanvas'"
          [tone]="pickerMode() === 'offcanvas' ? 'primary' : 'neutral'"
          (clicked)="setPickerMode('offcanvas')"
        />
        <orbit-icon-button
          icon="grid"
          ariaLabel="Griglia di anteprima"
          [attr.aria-checked]="pickerMode() === 'modal'"
          [tone]="pickerMode() === 'modal' ? 'primary' : 'neutral'"
          (clicked)="setPickerMode('modal')"
        />
      </div>
      <orbit-icon-button
        icon="grid"
        ariaLabel="Seleziona scheda"
        tone="neutral"
        (clicked)="openPicker()"
      />
    </div>
  </div>
}
<div class="orbit-tablist__tabs" [class.orbit-tablist__tabs--hidden]="overflowing()">
  <ng-content />
</div>
