image: node:22.22.3-bookworm

stages:
  - verify
  - publish

verify-package:
  stage: verify
  script:
    - npm ci
    - npm run release:check

publish-package:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/'
  before_script:
    - npm ci
    - npm config set @galileo:registry "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
  script:
    - npm run pack:check
    - cd dist/orbit-new && npm publish
