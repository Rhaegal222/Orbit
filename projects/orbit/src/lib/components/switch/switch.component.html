<label class="orbit-switch" [for]="inputId() || null">
  <input
    type="checkbox"
    class="orbit-switch__input"
    role="switch"
    [id]="inputId() || null"
    [checked]="isChecked()"
    [disabled]="isControlDisabled()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-checked]="isChecked()"
    (change)="onNativeChange($event)"
  />
  <span class="orbit-switch__track" aria-hidden="true"
    ><span class="orbit-switch__thumb"></span
  ></span>
  @if (label()) {
    <span class="orbit-switch__label">{{ label() }}</span>
  }
</label>
