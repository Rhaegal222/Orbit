<article>
  <h1>Selettore Ora</h1>
  <p>Campo orario con selettore numerico in popover e pulsanti di scelta rapida.</p>

  <section>
    <h2>Esempio</h2>
    <p>Selezione dell'orario di un appuntamento o di un evento.</p>
    <lab-example [code]="timeSnippet">
      <orbit-time-picker
        inputId="lab-time-picker"
        [formControl]="time"
        [quickOptions]="quickOptions"
      />
    </lab-example>
  </section>
</article>
