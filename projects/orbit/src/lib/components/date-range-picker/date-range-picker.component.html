<div class="orbit-drp" role="group" [attr.aria-label]="i18n.labels.openCalendar">
  <div class="orbit-drp__field">
    <label class="orbit-drp__label" [for]="startInputId() || null">{{
      startLabel() || i18n.labels.startDate
    }}</label>
    <orbit-date-picker
      [inputId]="startInputId()"
      [ariaLabel]="startLabel() || i18n.labels.startDate"
      [invalid]="invalid()"
      [minDate]="minDate()"
      [maxDate]="end() || maxDate()"
      [disabled]="isDisabled()"
      [value]="start()"
      (valueChange)="onStartChange($event)"
    />
  </div>
  <span class="orbit-drp__separator" aria-hidden="true">–</span>
  <div class="orbit-drp__field">
    <label class="orbit-drp__label" [for]="endInputId() || null">{{
      endLabel() || i18n.labels.endDate
    }}</label>
    <orbit-date-picker
      [inputId]="endInputId()"
      [ariaLabel]="endLabel() || i18n.labels.endDate"
      [invalid]="invalid()"
      [minDate]="start() || minDate()"
      [maxDate]="maxDate()"
      [disabled]="isDisabled()"
      [value]="end()"
      (valueChange)="onEndChange($event)"
    />
  </div>
</div>
