<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Orbit is an Angular UI component library. The public site is currently in progress." />
    <title>Orbit — Work in progress</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101828; color: #f8fafc; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
      main { width: min(100%, 44rem); display: grid; gap: 1.5rem; }
      .eyebrow { width: fit-content; margin: 0; padding: 0.375rem 0.75rem; border: 0.0625rem solid #94a3b8; border-radius: 999rem; color: #cbd5e1; font-size: 0.875rem; font-weight: 600; }
      h1 { max-width: 28rem; margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1; text-wrap: balance; }
      p { max-width: 38rem; margin: 0; color: #cbd5e1; font-size: 1.125rem; line-height: 1.6; text-wrap: pretty; }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a { padding: 0.75rem 1rem; border: 0.0625rem solid #38bdf8; border-radius: 0.5rem; color: #f8fafc; font-weight: 700; text-decoration: none; }
      a:hover { background: #0c4a6e; }
      a:focus-visible { outline: 0.1875rem solid #f8fafc; outline-offset: 0.1875rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Work in progress</p>
      <h1>Orbit is taking shape.</h1>
      <p>The public home is being refined. Explore the component catalog in Orbit Lab or preview the theme configurator in Orbit Studio.</p>
      <nav aria-label="Orbit previews">
        <a href="/lab/">Open Orbit Lab</a>
        <a href="/studio/">Open Orbit Studio</a>
      </nav>
    </main>
  </body>
</html>
