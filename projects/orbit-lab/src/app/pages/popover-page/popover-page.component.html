<article>
  <h1>Popover</h1>
  <p>
    Overlay CDK ancorato al trigger, con backdrop e chiusura su Escape opzionali. Il contenuto è
    un testo semplice; per contenuti ricchi comporre un dialog con <code>OrbitDialogService</code>.
  </p>

  <section>
    <h2>Posizione bottom (default)</h2>
    <lab-example [code]="snippet">
      <orbit-popover content="Testo del popover" position="bottom">
        <orbit-button label="Apri popover" />
      </orbit-popover>
    </lab-example>
  </section>
</article>
