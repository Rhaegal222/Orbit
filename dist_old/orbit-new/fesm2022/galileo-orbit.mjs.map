<div class="orbit-modal-header__content">
  @if (loading()) {
    <span class="orbit-modal-header__spinner"></span>
  }
  <div class="orbit-modal-header__text">
    <h2 class="orbit-modal-header__title" [id]="titleId() || null">{{ title() }}</h2>
    @if (subtitle()) {
      <p class="orbit-modal-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
</div>

@if (closable()) {
  <orbit-icon-button
    class="orbit-modal-header__close"
    ariaLabel="Chiudi"
    (clicked)="onClose()"
  >
    <svg viewBox="0 0 16 16" fill="none" class="orbit-modal-header__close-icon">
      <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </orbit-icon-button>
}
