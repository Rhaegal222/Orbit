<div class="orbit-form-action-bar">
  @if (showCancel()) {
    <button
      type="button"
      class="orbit-form-action-bar__btn orbit-form-action-bar__btn--cancel"
      [disabled]="loading()"
      (click)="cancel.emit()"
    >
      {{ cancelLabel() }}
    </button>
  }

  @if (showDraft()) {
    <button
      type="button"
      class="orbit-form-action-bar__btn orbit-form-action-bar__btn--draft"
      [disabled]="loading()"
      (click)="saveDraft.emit()"
    >
      <svg viewBox="0 0 16 16" fill="none" class="orbit-form-action-bar__icon">
        <path d="M3 8a5 5 0 1 1 1.5 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M3 12V8h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      {{ draftLabel() }}
    </button>
  }

  <button
    type="button"
    class="orbit-form-action-bar__btn orbit-form-action-bar__btn--confirm"
    [disabled]="loading() || confirmDisabled()"
    (click)="confirm.emit()"
  >
    @if (loading()) {
      <span class="orbit-form-action-bar__spinner"></span>
    } @else {
      <svg viewBox="0 0 16 16" fill="none" class="orbit-form-action-bar__icon">
        <path d="M4 8.5l3 3 5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
    {{ confirmLabel() }}
  </button>
</div>
