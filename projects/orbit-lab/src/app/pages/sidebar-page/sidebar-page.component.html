<article>
  <h1>Sidebar</h1>
  <p>
    Rail di navigazione generico, con sezioni tipizzate, badge, stato attivo, footer proiettabile e
    modalità compatta controllata dal consumer.
  </p>

  <section>
    <h2>Varianti</h2>
    <lab-example [code]="snippet" fullWidth>
      <div class="sidebar-page__preview">
        <orbit-sidebar
          brand="Orbit"
          brandShort="O"
          brandIcon="layers"
          ariaLabel="Anteprima sidebar"
          [sections]="currentSections()"
          [activeId]="activeId()"
          [collapsed]="collapsed()"
          (itemSelected)="select($event)"
          (collapsedChange)="setCollapsed($event)"
        >
          <span orbitSidebarFooter>Footer proiettato</span>
        </orbit-sidebar>
        <aside class="sidebar-page__variant-panel" aria-label="Selettore variante sidebar">
          <div class="sidebar-page__variant-copy" aria-live="polite">
            <span>Variante in anteprima</span>
            <strong>{{ variantLabel() }}</strong>
          </div>

          <div class="sidebar-page__variant-actions" aria-label="Varianti sidebar">
            <orbit-button
              label="Espansa"
              [variant]="variant() === 'expanded' ? 'solid' : 'outline'"
              [tone]="variant() === 'expanded' ? 'primary' : 'neutral'"
              (clicked)="setVariant('expanded')"
            />
            <orbit-button
              label="Compatta"
              [variant]="variant() === 'compact' ? 'solid' : 'outline'"
              [tone]="variant() === 'compact' ? 'primary' : 'neutral'"
              (clicked)="setVariant('compact')"
            />
            <orbit-button
              label="Stati item"
              [variant]="variant() === 'states' ? 'solid' : 'outline'"
              [tone]="variant() === 'states' ? 'primary' : 'neutral'"
              (clicked)="setVariant('states')"
            />
          </div>
        </aside>
      </div>
    </lab-example>
  </section>

</article>
