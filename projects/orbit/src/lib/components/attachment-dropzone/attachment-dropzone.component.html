<div
  class="orbit-drop__zone"
  [class.orbit-drop__zone--drag]="isDragOver()"
  [class.orbit-drop__zone--disabled]="disabled()"
  [class.orbit-drop__zone--error]="visibleError()"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="onZoneClick()"
  (keydown)="onZoneKeydown($event)"
  role="button"
  tabindex="0"
  [attr.aria-disabled]="disabled()"
>
  <svg viewBox="0 0 48 48" fill="none" class="orbit-drop__icon">
    <rect x="4" y="8" width="40" height="32" rx="4" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M24 18v12M18 24h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <span class="orbit-drop__label">{{ label() || i18n.labels.uploadLabel }}</span>
  <span class="orbit-drop__hint">{{ hint() || i18n.labels.uploadHint }}</span>
  @if (visibleError()) {
    <span class="orbit-drop__error" role="alert">{{ visibleError() }}</span>
  }
</div>

<input
  #fileInput
  type="file"
  class="orbit-drop__input"
  [accept]="accept()"
  [multiple]="multiple()"
  [disabled]="disabled()"
  [attr.aria-invalid]="visibleError() ? 'true' : null"
  (change)="onInputChange($event)"
/>
