services:
  orbit:
    build: .
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - proxy
    expose:
      - "8080"
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.docker.network=proxy
      - traefik.http.routers.orbit.rule=Host(`orbit.wyrmrest.it`) || Host(`orbit.wyrmrest.com`)
      - traefik.http.routers.orbit.entrypoints=websecure
      - traefik.http.routers.orbit.tls=true
      - traefik.http.services.orbit.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
networks:
  proxy:
    external: true
