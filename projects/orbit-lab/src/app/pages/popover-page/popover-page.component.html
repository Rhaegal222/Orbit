<article>
  <h1>Popover</h1>
  <p>
    Overlay CDK ancorato al trigger, con backdrop e chiusura su Escape opzionali. Il contenuto è un
    testo semplice; per contenuti ricchi comporre un dialog con <code>OrbitDialogService</code>.
  </p>

  <section>
    <h2>Esempio</h2>
    <lab-example [code]="snippet">
      <orbit-popover content="La disponibilità è aggiornata ogni 15 minuti." position="bottom">
        <orbit-button label="Verifica disponibilità" />
      </orbit-popover>
    </lab-example>
  </section>
</article>
