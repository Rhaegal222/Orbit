<article>
  <h1>Pickers</h1>
  <p>Campi editabili con popup aperto esclusivamente dal trigger laterale.</p>

  <section>
    <h2>Date picker</h2>
    <orbit-date-picker inputId="lab-date-picker" [formControl]="date" />
  </section>

  <section>
    <h2>Time picker</h2>
    <orbit-time-picker inputId="lab-time-picker" [formControl]="time" [quickOptions]="quickOptions" />
  </section>
</article>
