<button
  class="orbit-icon-button"
  [class.orbit-icon-button--primary]="tone() === 'primary'"
  [class.orbit-icon-button--danger]="tone() === 'danger'"
  [type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="onClick()"
>
  @if (icon(); as iconName) {
    <orbit-icon [name]="iconName" />
  } @else {
    <ng-content />
  }
</button>
