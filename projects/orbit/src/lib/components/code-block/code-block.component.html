<div class="orbit-code-block">
  @if (showActions() && collapsible()) {
    <div class="orbit-code-block__actions">
      <button
        type="button"
        class="orbit-code-block__action"
        data-toggle-code
        [attr.aria-expanded]="!collapsed()"
        [attr.aria-controls]="panelId"
        (click)="toggle()"
      >
        {{ collapsed() ? 'Mostra codice' : 'Nascondi codice' }}
      </button>
    </div>
  }
  <div class="orbit-code-block__surface" [hidden]="collapsible() && collapsed()">
    @if (showCopiedFeedback()) {
      <div class="orbit-code-block__copied-feedback" aria-hidden="true">
        <orbit-icon name="check" class="orbit-code-block__copied-icon" />
        <span class="orbit-code-block__copied-label">Copiato</span>
      </div>
    }
    @if (showActions()) {
      <orbit-icon-button
        class="orbit-code-block__copy"
        data-copy-code
        [ariaLabel]="copyLabel() === 'Copiato' ? 'Codice copiato' : 'Copia codice'"
        tone="neutral"
        (clicked)="copy()"
      >
        <orbit-icon name="copy" />
      </orbit-icon-button>
    }
    <pre
      #codeSurface
      class="orbit-code-block__pre"
      data-code-block
      [id]="panelId"
    ><code class="orbit-code-block__code">@for (line of lines(); track $index) {<span
      class="orbit-code-block__line"
    ><span class="orbit-code-block__line-number" aria-hidden="true">{{ $index + 1 }}</span><span class="orbit-code-block__line-content">{{ line || ' ' }}</span></span>}</code></pre>
  </div>
</div>
