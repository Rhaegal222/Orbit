<article>
  <h1>Badge</h1>
  <p>Etichetta di stato compatta, piena e leggibile, con sei toni semantici.</p>

  <section>
    <h2>Toni</h2>
    @for (tone of tones; track tone) {
      <lab-example [code]="toneSnippet(tone)">
        <orbit-badge [tone]="tone" [label]="labels[tone]" />
      </lab-example>
    }
  </section>

  <section>
    <h2>Accessibilità</h2>
    <p>
      Il colore non è l'unico indicatore: ogni badge riporta un'etichetta testuale leggibile,
      mai solo un pallino o un bordo colorato.
    </p>
  </section>
</article>
