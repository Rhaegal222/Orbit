<article>
  <h1>Tooltip</h1>
  <p>
    <code>orbitTooltip</code> è una direttiva applicabile a qualsiasi elemento: mostra il testo su
    hover e su focus da tastiera, e lo rimuove su Escape/blur.
  </p>

  <section>
    <h2>Posizione top (default)</h2>
    <lab-example [code]="snippet">
      <button type="button" orbitTooltip="Testo del tooltip" orbitTooltipPosition="top">
        Passa il mouse o naviga con Tab
      </button>
    </lab-example>
  </section>
</article>
