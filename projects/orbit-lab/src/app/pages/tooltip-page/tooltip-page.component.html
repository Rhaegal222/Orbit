<article>
  <h1>Tooltip</h1>
  <p>
    <code>orbitTooltip</code> è una direttiva applicabile a qualsiasi elemento: mostra il testo su
    hover e su focus da tastiera, e lo rimuove su Escape/blur.
  </p>

  <section>
    <h2>Esempio</h2>
    <lab-example [code]="snippet">
      <button
        type="button"
        orbitTooltip="Il codice SKU è visibile ai soli operatori."
        orbitTooltipPosition="top"
      >
        Informazioni sul codice SKU
      </button>
    </lab-example>
  </section>
</article>
