<div class="orbit-modal-body__scroll">
  <ng-content></ng-content>

  @if (loading()) {
    <div class="orbit-modal-body__loader" [class.orbit-modal-body__loader--small]="loaderSmall()">
      <span class="orbit-modal-body__spinner"></span>
      <span class="orbit-modal-body__loader-text">{{ loadingLabel() }}</span>
    </div>
  }
</div>
