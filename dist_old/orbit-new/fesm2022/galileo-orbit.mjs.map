<div class="orbit-form-action-bar">
  @if (showCancel()) {
    <orbit-button
      class="orbit-form-action-bar__btn orbit-form-action-bar__btn--cancel"
      [label]="cancelLabel()"
      variant="outline"
      tone="neutral"
      [disabled]="loading()"
      (clicked)="cancel.emit()"
    />
  }

  @if (showDraft()) {
    <orbit-button
      class="orbit-form-action-bar__btn orbit-form-action-bar__btn--draft"
      [label]="draftLabel()"
      variant="soft"
      tone="neutral"
      [disabled]="loading()"
      (clicked)="saveDraft.emit()"
    />
  }

  <orbit-button
    class="orbit-form-action-bar__btn orbit-form-action-bar__btn--confirm"
    [label]="confirmLabel()"
    variant="solid"
    [tone]="confirmTone()"
    [loading]="loading()"
    [disabled]="loading() || confirmDisabled()"
    (clicked)="confirm.emit()"
  />
</div>
