<article>
  <h1>Operational modal</h1>
  <p>Composizione neutra che riproduce densità, gerarchia e layout del riferimento.</p>

  <orbit-modal labelledBy="operational-modal-title" size="md">
    <orbit-modal-header
      titleId="operational-modal-title"
      title="Crea configurazione"
      subtitle="Contesto · Identificativo 1837698"
    >
      <svg orbitModalHeaderIcon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M6 4h12l2 3v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7l2-3Z" />
        <path d="M8 12h8M8 16h5" />
      </svg>
    </orbit-modal-header>

    <orbit-modal-body>
      <orbit-form-grid>
        <div primary class="operational-modal__column">
          <orbit-form-section [index]="1" title="Informazioni principali" [contentSpacing]="true">
            <orbit-form-grid>
              <div orbitFormGridItem [span]="12">
                <orbit-form-field label="Categoria" inputId="modal-category">
                  <orbit-select inputId="modal-category" [options]="categoryOptions" />
                </orbit-form-field>
              </div>
              <div orbitFormGridItem [span]="12">
                <orbit-form-field label="Titolo" inputId="modal-title">
                  <orbit-text-input inputId="modal-title" placeholder="Elemento di esempio" />
                </orbit-form-field>
              </div>
              <div orbitFormGridItem [span]="4">
                <orbit-form-field label="Data iniziale" inputId="modal-start">
                  <orbit-date-picker inputId="modal-start" placeholder="08 / 01 / 2026" />
                </orbit-form-field>
              </div>
              <div orbitFormGridItem [span]="4">
                <orbit-form-field label="Data finale" inputId="modal-end">
                  <orbit-date-picker inputId="modal-end" placeholder="08 / 01 / 2027" />
                </orbit-form-field>
              </div>
              <div orbitFormGridItem [span]="4">
                <orbit-form-field label="Orario" inputId="modal-time">
                  <orbit-time-picker inputId="modal-time" />
                </orbit-form-field>
              </div>
            </orbit-form-grid>
          </orbit-form-section>

          <orbit-form-section [index]="2" title="Valori" [contentSpacing]="true">
            <orbit-form-grid>
              <div orbitFormGridItem [span]="6">
                <orbit-form-field label="Valore principale" inputId="modal-value-a">
                  <orbit-text-input
                    inputId="modal-value-a"
                    type="currency"
                    [formControl]="primaryAmount"
                    readonly
                  />
                </orbit-form-field>
              </div>
              <div orbitFormGridItem [span]="6">
                <orbit-form-field label="Valore secondario" inputId="modal-value-b">
                  <orbit-text-input
                    inputId="modal-value-b"
                    type="currency"
                    [formControl]="secondaryAmount"
                    readonly
                    tone="success"
                  />
                </orbit-form-field>
              </div>
            </orbit-form-grid>
          </orbit-form-section>
        </div>

        <div secondary class="operational-modal__column">
          <orbit-form-section [index]="3" title="Opzioni" [contentSpacing]="true">
            <orbit-badge orbitFormSectionMeta tone="primary" label="2 attive" />
            <orbit-form-grid>
              <div orbitFormGridItem [span]="4"><orbit-selectable-tile label="Opzione A" [selected]="true" /></div>
              <div orbitFormGridItem [span]="4"><orbit-selectable-tile label="Opzione B" /></div>
              <div orbitFormGridItem [span]="4"><orbit-selectable-tile label="Opzione C" /></div>
            </orbit-form-grid>
          </orbit-form-section>

          <orbit-form-section [index]="4" title="Allegati" [contentSpacing]="true">
            <orbit-attachment-list [entries]="attachments" />
            <orbit-divider variant="dashed" />
            <orbit-attachment-dropzone hint="PDF, JPG, PNG · max 10 MB" />
          </orbit-form-section>
        </div>
      </orbit-form-grid>
    </orbit-modal-body>

    <orbit-modal-footer variant="form">
      <orbit-form-action-bar confirmTone="success" statusLabel="Salvataggio automatico attivo" />
    </orbit-modal-footer>
  </orbit-modal>
</article>
