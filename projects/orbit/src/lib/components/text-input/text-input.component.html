<div
  class="orbit-input"
  [class.orbit-input--with-leading]="leadingIcon() || type() === 'currency'"
  [class.orbit-input--with-trailing]="trailingIcon() || type() === 'password'"
>
  @if (leadingIcon() && type() !== 'currency') {
    <span class="orbit-input__icon orbit-input__icon--leading" [class]="leadingIcon()" aria-hidden="true"></span>
  }
  @if (type() === 'currency') {
    <span class="orbit-input__symbol" aria-hidden="true">{{ currencySymbol() }}</span>
  }

  <input
    class="orbit-input__control"
    [id]="inputId() || null"
    [type]="nativeType"
    [attr.inputmode]="inputMode"
    [value]="value()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [required]="required()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (type() === 'password') {
    <button
      type="button"
      class="orbit-input__action"
      [disabled]="isDisabled()"
      [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'"
      (click)="togglePasswordVisibility()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" class="orbit-input__password-icon">
        @if (showPassword()) {
          <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.1A10.5 10.5 0 0 1 12 5c5.2 0 8.7 4.2 9.7 7-.4 1.1-1.2 2.5-2.5 3.7M6.2 6.2C4.3 7.7 3.1 10 2.3 12c1 2.8 4.5 7 9.7 7 1.1 0 2.1-.2 3-.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
        } @else {
          <path d="M2.3 12C3.3 9.2 6.8 5 12 5s8.7 4.2 9.7 7c-1 2.8-4.5 7-9.7 7S3.3 14.8 2.3 12Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.7" />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
        }
      </svg>
    </button>
  } @else if (trailingIcon() && trailingIconLabel()) {
    <button
      type="button"
      class="orbit-input__action"
      [disabled]="isDisabled()"
      [attr.aria-label]="trailingIconLabel()"
      (click)="trailingIconClick.emit()"
    >
      <span [class]="trailingIcon()" aria-hidden="true"></span>
    </button>
  } @else if (trailingIcon()) {
    <span class="orbit-input__icon orbit-input__icon--trailing" [class]="trailingIcon()" aria-hidden="true"></span>
  }
</div>
