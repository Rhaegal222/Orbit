<article>
  <h1>Sidebar</h1>
  <p>
    Rail di navigazione generico, con sezioni tipizzate, badge, stato attivo, footer proiettabile e
    modalità compatta controllata dal consumer.
  </p>

  <section>
    <lab-example [code]="snippet" fullWidth>
      <div class="sidebar-page__preview">
        <orbit-sidebar
          brand="Orbit"
          [brandIcon]="showBrandIcon() ? 'layers' : null"
          ariaLabel="Anteprima sidebar"
          [sections]="currentSections()"
          [activeId]="activeId()"
          [collapsed]="collapsed()"
          (itemSelected)="select($event)"
          (collapsedChange)="setCollapsed($event)"
        >
          <span orbitSidebarFooter>Footer proiettato</span>
        </orbit-sidebar>
        <aside class="sidebar-page__variant-panel" aria-label="Selettore variante sidebar">
          <div class="sidebar-page__variant-copy" aria-live="polite">
            <span>Variante in anteprima</span>
            <strong>{{ variantLabel() }}</strong>
          </div>

          <div class="sidebar-page__tile-group" aria-label="Varianti sidebar">
            <orbit-selectable-tile
              label="Espansa"
              description="Rail completa"
              [selected]="selectedVariant() === 'expanded'"
              (selectedChange)="selectVariant('expanded')"
            >
              <orbit-icon orbitSelectableTileIcon name="layers" aria-hidden="true" />
            </orbit-selectable-tile>
            <orbit-selectable-tile
              label="Compatta"
              description="Solo icone"
              [selected]="selectedVariant() === 'compact'"
              (selectedChange)="selectVariant('compact')"
            >
              <orbit-icon orbitSelectableTileIcon name="home" aria-hidden="true" />
            </orbit-selectable-tile>
            <orbit-selectable-tile
              class="sidebar-page__tile--separated"
              label="Stati item"
              description="Attivo, badge e disabilitato"
              [selected]="selectedVariant() === 'states'"
              (selectedChange)="selectVariant('states')"
            >
              <orbit-icon orbitSelectableTileIcon name="check" aria-hidden="true" />
            </orbit-selectable-tile>
          </div>

          <div class="sidebar-page__tile-group" aria-label="Aspetto brand">
            <orbit-selectable-tile
              label="Con logo"
              description="Icona del brand"
              [selected]="showBrandIcon()"
              (selectedChange)="selectBrandIcon(true)"
            >
              <orbit-icon orbitSelectableTileIcon name="layers" aria-hidden="true" />
            </orbit-selectable-tile>
            <orbit-selectable-tile
              label="Senza logo"
              description="Iniziale del brand"
              [selected]="!showBrandIcon()"
              (selectedChange)="selectBrandIcon(false)"
            />
          </div>
        </aside>
      </div>
    </lab-example>
  </section>
</article>
