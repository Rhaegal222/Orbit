name: Bump @rhaegal222/orbit from npm

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday 08:00 UTC
  workflow_dispatch:

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check latest npm version
        id: npm
        run: |
          LATEST=$(npm view @rhaegal222/orbit version 2>/dev/null || echo "")
          CURRENT=$(node -p "require('./projects/orbit/package.json').dependencies['@rhaegal222/orbit']" | tr -d '"^~')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT, Latest: $LATEST"

      - name: Create PR if newer version available
        if: steps.npm.outputs.latest != steps.npm.outputs.current
        env:
          GH_TOKEN: ${{ secrets.FORGEJO_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.npm.outputs.latest }}"

          # Create branch
          BRANCH="chore/bump-orbit-${VERSION}"
          git checkout -b "$BRANCH"

          # Update package.json
          sed -i "s|\"@rhaegal222/orbit\": \"[^\"]*\"|\"@rhaegal222/orbit\": \"^${VERSION}\"|" \
            projects/orbit/package.json
          sed -i "s|\"@rhaegal222/orbit\": \"[^\"]*\"|\"@rhaegal222/orbit\": \"^${VERSION}\"|" \
            package.json

          git add projects/orbit/package.json package.json
          git commit -m "chore: bump @rhaegal222/orbit to ^${VERSION}"
          git push origin "$BRANCH"

          # Create MR
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://git.wyrmrest.it/api/v1/repos/wyrmrest/wyrmrest-orbit/pulls" \
            -d "{
              \"title\": \"chore: bump @rhaegal222/orbit to ^${VERSION}\",
              \"body\": \"Auto-bump of \`@rhaegal222/orbit\` from npm.\\n\\nPrevious: ${{ steps.npm.outputs.current }}\\nNew: ^${VERSION}\\n\\n---\\n*Created by npm-bump workflow*\",
              \"head\": \"$BRANCH\",
              \"base\": \"develop\"
            }" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'MR: {d.get(\"html_url\", \"ERROR\")}')"

      - name: Already up to date
        if: steps.npm.outputs.latest == steps.npm.outputs.current
        run: echo "Forgejo already on latest version (${{ steps.npm.outputs.current }})"
