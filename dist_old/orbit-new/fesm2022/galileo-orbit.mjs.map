<div class="orbit-form-field">
  @if (label()) {
    <label
      class="orbit-form-field__label"
      [for]="inputId() || null"
    >
      {{ label() }}
      @if (required()) {
        <span class="orbit-form-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="orbit-form-field__control">
    <ng-content />
  </div>

  @if (hint() && !error()) {
    <p class="orbit-form-field__hint">{{ hint() }}</p>
  }

  @if (error()) {
    <p class="orbit-form-field__error" role="alert">{{ error() }}</p>
  }
</div>
