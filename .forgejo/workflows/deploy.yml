name: Deploy Orbit website

on:
  push:
    branches: [staging, main]

concurrency:
  group: orbit-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Angular apps
        run: |
          npx ng build orbit-lab --configuration=production --base-href /lab/
          npx ng build orbit-studio --configuration=production --base-href /studio/
          npx ng build service --configuration=production --base-href /landing/

      - name: Copy build outputs to deploy/
        run: |
          mkdir -p deploy/lab deploy/studio deploy/landing
          cp -r dist/orbit-lab/browser/* deploy/lab/
          cp -r dist/orbit-studio/browser/* deploy/studio/
          cp -r dist/service/browser/* deploy/landing/

      - name: Select target
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_DIR=/home/rhaegal222/Server/main/rhaegal222/wyrmrest/wyrmrest-orbit" >> "$GITHUB_ENV"
            echo "PROJECT_NAME=wyrmrest-orbit-production" >> "$GITHUB_ENV"
            echo "TRAEFIK_ENABLE=true" >> "$GITHUB_ENV"
            echo "CONTAINER_NAME=wyrmrest-orbit-production-orbit-1" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_DIR=/home/rhaegal222/Server/staging/rhaegal222/wyrmrest/wyrmrest-orbit" >> "$GITHUB_ENV"
            echo "PROJECT_NAME=wyrmrest-orbit-staging" >> "$GITHUB_ENV"
            echo "TRAEFIK_ENABLE=false" >> "$GITHUB_ENV"
            echo "CONTAINER_NAME=wyrmrest-orbit-staging-orbit-1" >> "$GITHUB_ENV"
          fi

      - name: Materialize deployment worktree
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C "$DEPLOY_DIR"

      - name: Build and start service
        run: |
          set -euo pipefail
          TRAEFIK_ENABLE="$TRAEFIK_ENABLE" docker compose -p "$PROJECT_NAME" -f "$DEPLOY_DIR/deploy/docker-compose.yml" up -d --build --force-recreate

      - name: Verify container health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo starting)
            echo "attempt $attempt/12: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker logs "$CONTAINER_NAME" --tail 60 || true
          exit 1
