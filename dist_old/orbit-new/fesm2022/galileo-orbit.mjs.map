<div
  class="orbit-pill-switch"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
  [class.orbit-pill-switch--disabled]="isDisabled()"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="orbit-pill-switch__option"
      role="radio"
      [class.orbit-pill-switch__option--selected]="option.value === selectedValue()"
      [attr.aria-checked]="option.value === selectedValue()"
      [disabled]="isDisabled() || option.disabled"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
