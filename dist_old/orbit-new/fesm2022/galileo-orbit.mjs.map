<button
  [type]="type()"
  [attr.aria-label]="ariaLabel() || null"
  [disabled]="disabled() || loading()"
  class="orbit-btn"
  [class.orbit-btn--solid]="variant() === 'solid'"
  [class.orbit-btn--soft]="variant() === 'soft'"
  [class.orbit-btn--outline]="variant() === 'outline'"
  [class.orbit-btn--flat]="variant() === 'flat'"
  [class.orbit-btn--primary]="tone() === 'primary'"
  [class.orbit-btn--success]="tone() === 'success'"
  [class.orbit-btn--danger]="tone() === 'danger'"
  [class.orbit-btn--neutral]="tone() === 'neutral'"
  [class.orbit-btn--icon-only]="iconOnly()"
  [class.orbit-btn--loading]="loading()"
  (click)="onClick()"
>
  @if (loading()) {
    <span class="orbit-btn__spinner" aria-hidden="true"></span>
  }
  @if (!loading() && icon()) {
    <span class="orbit-btn__icon" [class]="icon()" aria-hidden="true"></span>
  }
  @if (label()) {
    <span class="orbit-btn__label">{{ label() }}</span>
  }
</button>
