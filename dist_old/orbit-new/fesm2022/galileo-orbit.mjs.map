<label
  class="orbit-checkbox"
  [class.orbit-checkbox--disabled]="isDisabled()"
  [for]="inputId() || null"
>
  <input
    #checkbox
    type="checkbox"
    class="orbit-checkbox__input"
    [id]="inputId() || null"
    [checked]="isChecked()"
    [disabled]="isDisabled()"
    [required]="required()"
    (change)="toggle()"
  />
  <span class="orbit-checkbox__box" aria-hidden="true">
    @if (isChecked()) {
      <svg viewBox="0 0 16 16" fill="none" class="orbit-checkbox__check">
        <path d="M3 8L6.5 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
  </span>
  @if (label()) {
    <span class="orbit-checkbox__label">{{ label() }}</span>
  }
</label>
