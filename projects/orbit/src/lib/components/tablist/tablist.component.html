@if (overflowing() && pickerMode() !== 'scroll') {
  <div class="orbit-tablist__compact">
    <div class="orbit-tablist__compact-current">
      <span class="orbit-tablist__compact-label">{{ currentTab?.label() ?? '' }}</span>
      @if (currentTab?.badge()) {
        <orbit-badge [label]="currentTab!.badge()!.label()" [tone]="currentTab!.badge()!.tone()" />
      }
    </div>
    <div class="orbit-tablist__compact-actions">
      <orbit-icon-button
        [icon]="pickerMode() === 'offcanvas' ? 'menu' : 'grid'"
        ariaLabel="Seleziona scheda"
        tone="neutral"
        (clicked)="openPicker()"
      />
    </div>
  </div>
}
<div #tabsWrapper class="orbit-tablist__tabs" [class.orbit-tablist__tabs--scroll]="pickerMode() === 'scroll'" [class.orbit-tablist__tabs--hidden]="overflowing() && pickerMode() !== 'scroll'">
  <ng-content />
</div>
