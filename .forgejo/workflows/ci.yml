name: verify-package

on:
  push:
    branches: [develop, staging, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, staging, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run release:check
